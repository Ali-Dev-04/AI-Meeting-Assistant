name: ✨ Feature request
description: Suggest a new feature or improvement
title: "[feat]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Help us understand the problem before the solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected?
      placeholder: "As a <role>, I want <goal> so that <benefit>."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you've thought about solving this, and why they fall short.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Frontend (web)
        - Backend (api)
        - Worker / AI pipeline
        - Search / Chat
        - Auth / Billing
        - Documentation
        - DevOps / CI
        - Other
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "Nice to have"
        - "Should have"
        - "Must have"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links to competitors, or anything else relevant.
